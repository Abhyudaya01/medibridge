name: Build, test, and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Separate PR revisions so a stale run cannot hold up newer validation.
  # Main keeps its branch group so deployments remain serialized.
  group: medibridge-${{ github.event_name == 'pull_request' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Start isolated SQL Server for integration tests
        run: bash infra/ci-sql.sh
      - name: Test
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory "${{ runner.temp }}/medibridge-core-coverage"
      - name: Validate measured Core coverage
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, subprocess
          root = Path(os.environ['RUNNER_TEMP'])
          reports = list((root / 'medibridge-core-coverage').rglob('coverage.cobertura.xml'))
          if len(reports) != 1:
              raise SystemExit('Expected one Core-only Coverlet report.')
          subprocess.run(['python3', 'benchmarks/coverage/report.py', str(reports[0]), '--output', str(root / 'medibridge-coverage-summary/results/coverage.json')], check=True)
          PYCODE
      - name: Check coverage reporting
        run: python3 -m unittest discover -s benchmarks/coverage -p 'test_*.py'
      - name: Check load summary reporting
        run: python3 -m unittest discover -s benchmarks/load -p 'test_*.py'
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/MediBridge.Api --no-build -c Release -o publish
      - name: Read deployment target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: azure
        shell: bash
        run: |
          source infra/azure.env
          echo "app-name=$AZURE_APP_NAME" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.azure.outputs.app-name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
