name: Build, test, and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: medibridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Start isolated SQL Server for integration tests
        run: bash infra/ci-sql.sh
      - name: Test
        run: dotnet test --no-build -c Release
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/MediBridge.Api --no-build -c Release -o publish
      - name: Read deployment target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: azure
        shell: bash
        run: |
          source infra/azure.env
          echo "app-name=$AZURE_APP_NAME" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.azure.outputs.app-name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
